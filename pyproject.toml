[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planet-detector"
version = "0.1.0"
description = "A modular Kepler and TESS transit discovery pipeline"
requires-python = ">=3.11"
dependencies = [
    "lightkurve==2.6.0",
    "astroquery>=0.4.11,<0.5",
    "astropy>=7,<9",
    "numpy>=2,<3",
    "matplotlib>=3.10,<4",
]

[project.scripts]
planet-detector = "planet_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
